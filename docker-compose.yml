services:
  db:
    image: postgres:16
    container_name: nightlife-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: nightlife_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d nightlife_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
